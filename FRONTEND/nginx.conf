
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Ocultar versión de Nginx.
    server_tokens off;

    # Cabeceras de seguridad.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Política de seguridad de contenido.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' http://localhost:4450; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # Configuración para SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Configuración para archivos estáticos.
    location /static {
        expires 1y;
    }

    # Configuración de compresión.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
}
